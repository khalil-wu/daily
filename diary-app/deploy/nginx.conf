# Diary's existing default HTTP virtual host; other virtual hosts are untouched.
# Per-IP rate zones (http context via sites-enabled include).
limit_req_zone $binary_remote_addr zone=jideapi:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=jideotp:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=jideauth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/diary-current;
    index index.html;

    limit_req_status 429;
    error_page 429 @jide_ratelimit;
    location @jide_ratelimit {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control no-store always;
        return 429 '{"error":{"message":"操作过于频繁，请稍后再试"}}';
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        access_log off;
        default_type application/json;
        add_header Cache-Control no-store always;
        return 200 '{"status":"ok","service":"jide-diary"}';
    }
    location = /api/feedback {
        client_max_body_size 20k;
        proxy_pass http://127.0.0.1:18971;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    location = /api/feedback/health {
        proxy_pass http://127.0.0.1:18971;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control no-store always;
        access_log off;
    }
    # Human-verification gate (SVG captcha -> one-shot ticket).
    location = /api/captcha {
        limit_req zone=jideapi burst=10 nodelay;
        proxy_pass http://127.0.0.1:18971;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    location = /api/captcha/verify {
        limit_req zone=jideapi burst=10 nodelay;
        client_max_body_size 2k;
        proxy_pass http://127.0.0.1:18971;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    location ^~ /server/ { deny all; }
    location /api/ {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control no-store always;
        return 410 '{"detail":"旧小程序服务已退役"}';
    }
    # OTP sends go through the captcha gate service (valid ticket required);
    # it enforces per-IP/per-account daily caps then relays to CloudBase.
    location = /cb/auth/v1/verification {
        limit_req zone=jideotp burst=5 nodelay;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:18971;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    # Brute-force guards on the remaining auth endpoints.
    location ~ ^/cb/auth/v1/(signin|signup|verification/verify|reset) {
        limit_req zone=jideauth burst=5 nodelay;
        rewrite ^/cb/(.*)$ /$1 break;
        proxy_pass https://possible-wildebeest-d1br6c84180b.api.tcloudbasegateway.com;
        proxy_ssl_server_name on;
        proxy_set_header Host possible-wildebeest-d1br6c84180b.api.tcloudbasegateway.com;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /cb/ {
        proxy_pass https://possible-wildebeest-d1br6c84180b.api.tcloudbasegateway.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host possible-wildebeest-d1br6c84180b.api.tcloudbasegateway.com;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ ^/fonts/.+\.woff2$ {
        default_type font/woff2;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    # Expo includes a content hash in these URLs; old open tabs keep working.
    location ~ ^/(assets/|fonts/|_expo/static/).+\.[a-zA-Z0-9]+$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location ~ /\. { deny all; }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
